#Time Skip v2 (Taimu-jin): earned levels, no chaining, bosses only slowed, a 2 s cap on players, and the
#Taimu-jin passives Pure Progress and Time Sense.
[timeskip]
	#Time Skip levels: five TP levels set the skip's base (forms add at most formBonusCap of it).
	#Off: the form alone sets the skip, as in 0.4.0 (the caps, the chain immunity and the boss rule below still hold).
	v2 = true
	#TP price of each level (level 1 is given free to every Taimu-jin; -1 = that level is not sold).
	#Written into config/dragonminez/skills.json at every server start.
	levelPrices = [0, 400000, 1200000, 3000000, 7000000]
	#Share of the level's base duration and reach the strongest form may add (0-1).
	#Range: 0.0 ~ 1.0
	formBonusCap = 0.5
	#Longest a player is held (stopped or slowed) by one skip, in ticks. Never more than 40 (2 s).
	#Range: 10 ~ 40
	pvpCapTicks = 40
	#After a skip lets go of anything (its end, the cap, a break-out), no Time Skip can catch it again for this long.
	#Range: 20 ~ 200
	chainImmunityTicks = 80
	#Bosses (entity tag #dmzultra:skip_resistant, world bosses, anything taller than 2.5 blocks):
	#"slow" = never stopped, slowed to at least 60 % of their pace; "immune" = untouched.
	bosses = "slow"
	#No skip while the Taimu-jin is held (hit-stun, juggled, knocked down), caught in a skip, in a transformation
	#scene or in the God Ritual.
	hitstunRule = true
	#A player who was guarding when stopped keeps the guard up the whole stop (blows land as blocked, half poise damage).
	guardKept = true
	#Taimu-jin passive Pure Progress: the same attack landing a third time within 8 s is softened by 30 %, and the
	#fourth is dodged (once per 20 s).
	pureProgress = true
	#Taimu-jin passive Time Sense: a Taimu-jin always senses stopped time as if with Time Perception level 1
	#(never stopped by another Taimu-jin, only slowed) and sees a skip's warning ring 4 ticks earlier.
	timeSense = true
	#Warning ring: a skip lands telegraphTicks after the key press; a clock ring shows on the ground and players around
	#see the screen edge pulse, so a dash out of the ring escapes it. A blow that staggers the Taimu-jin in the windup cancels the skip.
	#Off: the skip lands on the press, as in 0.4.0.
	telegraph = true
	#Ticks between the key press and the skip landing (the warning ring's length).
	#Range: 4 ~ 20
	telegraphTicks = 8
	#Break out: a stopped player who presses the guard key breaks free at once, for breakKiCost of their max ki
	#(half with Time Perception 3 or more), and cannot be caught again for chainImmunityTicks.
	breakOut = true
	#Share of max ki a break-out costs.
	#Range: 0.1 ~ 0.9
	breakKiCost = 0.35

#Time Skip counterplay (W3-TIMESKIP-COUNTER, built by RACE-AP-3). The warning ring, the break-out and the kept guard
#are in [timeskip].
[timeskipcounter]
	#Shake Free: a fighter who is not stopped sneak-strikes a stopped ally (party, team) to jolt them out of a
	#Time Skip - no damage, the ally is free at once and cannot be caught again for timeskip.chainImmunityTicks.
	shakeFree = true
	#Share of the striker's max ki Shake Free costs (half with Time Perception 2 or more).
