	#Range: 5 ~ 60
	grabHoldTicks = 15
	#How far the grab reaches, in blocks.
	#Range: 2.0 ~ 8.0
	grabReach = 4.5
	#The most a grab does to a player: this share of their maximum health (a player is never erased outright).
	#Range: 5 ~ 90
	grabPlayerCapPercent = 60
	#The most a grab does to a boss: this share of their maximum health.
	#Range: 1 ~ 90
	grabBossPercent = 20
	#A blow on the caster worth this share of their maximum health breaks the grab.
	#Range: 1 ~ 100
	grabBreakPercent = 15
	#A Hakai of a God of Destruction who is a Kai's partner raises the Kai's Divine Bond (+2, three a day).
	kaiBond = true
	#Only an appointed God of Destruction may cast Hakai: candidates and apprentices may not, the techniques are never
	#sold, and whoever holds them without the seat has them taken back (an operator in creative mode testing excepted). Off: an
	#apprentice casts Hakai too, as before 0.4.
	destroyerOnly = true
	#A God of Destruction's Hakai sphere or beam that reaches a world in space erases it, whatever its power (the world's
	#own protections still hold: home and story worlds, sanctuaries, a player standing on it, claimed land). Off: Hakai never ends a world.
	planetErasure = true
	#Hakai as the anime shows it, drawn on the clients (client/hakai/HakaiCinema): the sphere forming over the hand,
	#the crackling sphere in flight, a violet envelope that traces the held or struck creature's shape, the body coming apart from its
	#edges inwards into rising motes over about two seconds, nothing left; a world erased by Hakai dissolves in violet light instead of
	#exploding. Off: the older look (server particles, the motes rising for a second). What Hakai does is the same either way.
	cinematicErasure = true

#The Destroyer Path's audience, discipline and uniform (lane DST-3). The path itself, its trials and the discipline's own
#master switch are in config/dmzultra/destroyer.json (path.*, discipline.*).
[destroyer_ultra]

	[destroyer_ultra.audience]
		#The Zenos' audience in the world: the Grand Priest and Zeno come to stand before an appointed God of Destruction and
		#before a hearing. Off: the appointment is the plain title and lines of the path, and a hearing is a line of chat.
		enabled = true
		#The Grand Priest and Zeno are seen in the world (two figures that stand a few seconds beside the player and are taken
		#away again; never saved). Off: the audience is its plates and titles only.
		attendants = true
		#The server may tell a player's client to play the staged (camera) version of the audience. Whether it is played is the
		#player's own opt-in (client option destroyer_ultra.stagedAudience, off).
		stagedCue = true

	[destroyer_ultra.discipline]
		#A Hakai grab on a player who is not in a spar or a duel earns a strike.
		hakaiOnPlayers = true
		#Erasing a liberated world outside a sanctioned trial earns a strike.
		worlds = true
		#A Hakai grab on a Kai or on an angel earns a strike.
		kaiAngel = true
		#How long the Grand Priest stands beside a player he warns, in seconds.
		#Range: 2 ~ 30
		warningSeconds = 6
		#The strike that calls a hearing before the Zenos (1 = every strike is a hearing; the first below it is a warning).
		#Range: 1 ~ 5
		strikesForHearing = 2

	[destroyer_ultra.uniform]
		#The Destroyer uniform is shared with the players who can see the wearer. Off: nobody is told who wears it (the unlock
		#and the colour are still kept).
		enabled = true

	[destroyer_ultra.admin]
		#The operators' command /dmzultra destroyer (report, set, energy, seat free, strikes clear, reset).
		enabled = true

[sense]
	#Ki Sense scan and track: in DragonMineZ' Ki Sense SEARCH mode the server answers a long-range scan (players and saga
	#fighters of the same dimension, beyond what the client has loaded) and lets a fighter track one signature. 2.2's rules hold:
	#0 % Power Release, the anti-ki cloak and an upgraded Android hide a fighter; a god form is hidden from those without God Ki;
	#Glind divine ki is hidden as DragonMineZ hides it. false: nothing is answered and DragonMineZ' own Ki Sense is unchanged.
	enabled = true
	#Scan range in blocks at Ki Sense level 1, before rangePerLevel.
	#Range: 32 ~ 16384
	baseRange = 256
	#Blocks added per Ki Sense level above the first.
	#Range: 0 ~ 4096
	rangePerLevel = 128
	#The scan range never goes above this (blocks).
	#Range: 32 ~ 30000
	maxRange = 2048
	#How many signatures a character remembers (the most recent ones; the Kai path reads them).
	#Range: 1 ~ 64
	memorySize = 16
	#At most this many signatures in one scan answer (players first, then the strongest).
	#Range: 1 ~ 64
	maxSignatures = 24

#The living multiverse's foundation (LIV-0): one pulse clock, per-character records, the news feed, the hub.
#Every later living system (colony war, encounters, bounties, stations ...) has its own section and switch.
[living]
	#Master switch of every living system. Off: no pulse runs, no system starts anything new, the hub says it is off.
	enabled = true
	#Ticks between two pulses of the simulation (400 = 20 s, three a minute).
	#Range: 100 ~ 2400
	pulseTicks = 400
	#Server-thread time one pulse may take, in microseconds; what is left over runs at the next pulse (round-robin).
	#Range: 200 ~ 20000
	pulseBudgetMicros = 2000
	#After the world opens, pulses run quickly (two a second) to cover the time the server was off - at most this many (0 = none).
	#Range: 0 ~ 600
	catchUpPulses = 90
	#News items kept per universe (the oldest drop off).
	#Range: 8 ~ 256
	newsPerUniverse = 64
	#Requests per second a player may send to a living system (token bucket; a burst of twice this).
	#Range: 1 ~ 40
	c2sPerSecond = 8
	#Living-system fighters and props alive around one player at most (war squads, ambushes, companions ...).
	#Range: 0 ~ 200
	maxEntitiesPerPlayer = 24
	#Living-system fighters and props alive on the whole server at most.
	#Range: 0 ~ 5000
	maxEntitiesServer = 300
	#The Living Multiverse screen (key 'Living Multiverse', unbound by default, or /dmzultra living hub): the news of every
	#universe and, as they arrive, the tabs of the living systems.
	hub = true
	#At login, a card 'While you trained...' with the news of your universe since that character was last seen.
	loginDigest = true
	#A saga villain defeated by a player is reported in the news of that universe (one item per villain and universe a day).
	sagaDefeatNews = true

#World events of the afterlife and the Demon Realm (lane WEV-1): Gomah's army in the Demon Realm, an ogre riot in Other World,
#villains breaking out of Hell. They use the same machinery, power rule and rewards as the events of Earth (see [worldEvents]),
#and never start while worldEvents.enabled is off.
[worldEventsRealms]
	#Switch of these three events (the events of Earth and the landing ambush are not touched by it).
	enabled = true
	#Average minutes of play on firm ground in the Demon Realm between two of Gomah's invasions (0 = never).
	#Range: 0.0 ~ 100000.0
	demonRealmMinutes = 40.0
	#Average minutes of play in Other World (above Hell) between two ogre riots (0 = never).
	#Range: 0.0 ~ 100000.0
	otherworldMinutes = 40.0
	#Average minutes of play in Hell between two breakouts (0 = never).
	#Range: 0.0 ~ 100000.0
	hellMinutes = 30.0
	#No event of any kind starts by itself within this many blocks of a DragonMineZ world boss (0 = no such rule).
	#Range: 0 ~ 2048
	bossClearance = 256
	#An event's start and end are reported in the living multiverse's news (needs the [living] section on).
	news = true

#Space travel events (G2): while you fly through open space, distress calls, pirate ambushes, asteroid storms and
#wrecks find you. Party members and passengers share one event.
[encounter]
	#Switch of the whole system. Off: nothing new starts and a running event ends cleanly.
	enabled = true
	#Space blocks travelled outside every planet's shell between two rolls.
	#Range: 200 ~ 100000
	checkEvery = 1500
	#Chance an event starts at a roll (times the destination's table weight).
	#Range: 0.0 ~ 1.0
	chance = 0.18
	#Quiet seconds after an event ends before the next roll may start one.
	#Range: 0 ~ 86400
	cooldownSeconds = 240
	#No event rolls within this many blocks of a planet's surface.
	#Range: 100 ~ 20000
	shellMargin = 600
	#Party members in space within this radius of the one who triggered an event take part in it.
	#Range: 16 ~ 1024
	partyRadius = 128
	#Storm rocks alive at once in one event.
	#Range: 4 ~ 64
	asteroidsMax = 24
	#Most pirates in one squad (the table gives a range, headcount raises it up to this).
	#Range: 1 ~ 12
	pirateSquadMax = 6
	#A pod or vehicle is never damaged by an event (rocks push it away); the pilot may still be struck, never to death.
	vehicleSafe = true
	#Base TP of an event's reward (a storm survived pays this; the others a multiple). Paid exactly, never boosted.
	#Range: 0 ~ 1000000
	rewardTp = 300
	#Most TP payments one character may get from travel events in a day (the ledger's per-character cap; the account cap comes on top).
	#Range: 1 ~ 1000
	paidPerDay = 24
	#Pirate ambushes.
	pirates = true
	#Drifting wrecks with salvage crates.
	derelict = true
	#Asteroid storms.
	asteroidStorm = true
	#Distress calls (a rescue, a trap).
	distress = true

[capsuleCorp]
	#Capsule Corporation as the anime shows it: DragonMineZ' own Capsule Corp site (its structure dragonminez:vegeta_pod,
	#where Vegeta and Bulma stand) builds our West City headquarters (data/dmzultra/structures/capsule_corp.nbt: the white main
	#dome with CAPSULE CORP. in red, Bulma's lab, the garden dome, the tower, the lawn and Vegeta's gravity room) instead of the small pod.
	#true - on (default), for chunks generated from now on.    false - DragonMineZ' pod, as before.
	newLook = true
	#In worlds made before: a Capsule Corp site that still has the small pod is rebuilt once, the first time it loads.
	#Only the old pod's own footprint is replaced; around it the new building takes only natural ground (grass, dirt, stone, trees),
	#and a site where player-built blocks stand in the way is left alone and logged (an operator builds it around them with
	#/dmzultra capsulecorp rebuild). Vegeta, Bulma, Granolah, Kid Trunks and the Fullbring mentor move to their new spots.
	#true - on (default; needs newLook).    false - old sites keep the pod.
	rebuildOld = true

