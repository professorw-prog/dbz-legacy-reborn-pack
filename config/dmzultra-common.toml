
#What this mod writes into DragonMineZ' own config files.
[prices]
	#Whether a price you have edited yourself is left alone.
	#
	#This mod adds transformation groups and ki techniques that DragonMineZ does
	#not have, so it has to write their prices into skills.json and character.json
	#- otherwise they would have no price at all and could never be bought.
	#
	#Until 01.09.2026 it wrote them on EVERY start, which meant it also wrote them
	#back over anything you had changed. Two modpack makers reported the same
	#thing: edit the cost of legendaryforms or of a ki attack, restart, and it is
	#our number again. That was a bug, not a policy.
	#
	#true  - write a price only when there is none yet, then never touch it again.
	#        Your edits survive every restart. This is the default.
	#false - write our prices on every start. Use this if you have edited something
	#        into a mess and want our defaults back, or if you want to follow our
	#        numbers as they change between versions.
	keepEditedPrices = true

#The balance of the transformation forms this mod adds.
[forms]
	#Which balance profile our own forms follow. DragonMineZ' own forms are never touched.
	#
	#classic  - the numbers before 07.09.2026 (stack forms as strong as top forms;
	#           Cell Max plus Black reaches x50). Kept as the way back.
	#sparking - stack forms in DragonMineZ' own range, top forms flatter; the strongest
	#           combination of every race lands between x9 and x14. The default. See Doku/62.
	#
	#Switching writes only the six balance fields of our forms, and only where they still
	#carry exactly the numbers of a profile this jar ships. A form you edited yourself is
	#kept and named in the log - this switch is not consent to overwrite your work.
	balanceProfile = "sparking"
	#Whether the player-level gates that DMZ Revamp puts on forms ("requiredDMZLevel": Human Buffed and the first
	#forms of the Namekian, Majin and Bio-Android at level 500, Super Saiyan at 500, Frost Demon at 150, Kaioken at 45,
	#Ultimate at 2500 ...) are ignored. The forms are then bought with their form skill, form levels and mastery only;
	#a player of any character level can use a form they have bought. Nothing in the config files has to change, and
	#without DMZ Revamp installed this does nothing.
	#true  - no level gates (default).    false - Revamp's gates apply as it ships them.
	ignoreLevelGates = true
	#Whether a form you have bought needs nothing else. DragonMineZ asks, on top of the skill level that buying gives,
	#a share of mastery of the form before it (Full Power needs Buffed at 25%, Overdrive needs Full Power at 25% ...;
	#the Sage forms need Supernova, the Fist forms need Crane Ascendant). Players are told which form is held back and
	#how much mastery is missing, whichever way this is set.
	#false - DragonMineZ' own chain of masteries (default).    true - a bought form is usable at once.
	waiveMasteryRequisites = false
	#Whether DragonMineZ' own forms drain no health either. DragonMineZ' Kaioken x2 to x20 (and any other form of its own
	#with a health drain) take a share of the fighter's health every second; our forms never do. With this on, no form
	#damages its fighter: the drain is answered as 0 while the server runs (DragonMineZ' config files are not changed,
	#so turning it off gives DragonMineZ' drains back at once). Ki and stamina drains are not touched.
	#true  - no form drains health (default).    false - DragonMineZ' own forms drain health as DragonMineZ ships them.
	zeroDmzHealthDrain = true

#Fighting in the ring.
[arena]
	#Whether stepping off the ring loses the fight.
	#
	#A Tenkaichi ring counts the grass around it as out; the Tournament of Power
	#counts falling off the platform. That is the rule that makes a ring a ring -
	#between two players.
	#
	#IT WAS OFF AGAINST THE ROSTER UNTIL 02.09.2026, and for a reason that has
	#since been fixed rather than a reason that was true. The rule used to read
	#the arena's markers as if they named the floor, so a fighter standing on his
	#own starting mark was already 'outside' - and losing that way is not the
	#fight anybody came for. It reads the ground now: grass is out, the platform
	#is in, and being thrown off is a defeat you can see coming.
	#
	#true  - out of the ring loses (default).
	#false - the fight ends on the fighters only.
	ringOutPlayerVersusPlayer = true
	ringOutAgainstFighters = true
	#Whether flight works inside the Tournament of Power ring.
	#
	#In the World of Void nobody flies - only a fighter with real wings. It is
	#not decoration: without it the platform has no edge worth falling off, and
	#a ring nobody can fall out of is a floor with a fight on it.
	#
	#Only during that fight, only in that ring, and only for the two in it.
	#Everybody watching keeps their flight, and so does the whole rest of the
	#world.
	#
	#false - no flight while the bell is up (default, and the series' rule).
	#true  - fly as usual; the platform is then merely somewhere to stand.
	flightInTournamentOfPower = false

#How this mod behaves next to other DragonMineZ add-ons.
#Whoever else brings the same content gets it, unless you say otherwise here.
[compatibility]

	#Deep space settings. The section keeps its old name, 'noea', so files from earlier versions keep their values.
	[compatibility.noea]
		#When deep space opens to a player.
		#true  - once the Saiyan Saga is finished (default)
		#false - with the Frieza Saga
		deepSpaceAfterSaiyanSaga = true
		#What blowing up a world pays.
		#true  - worth a number of stat points at the destroyer's own price for their next one
		#        (moon 4, world 8, ringed world 12, gas giant 16, star 30, +15% per tier); and every
		#        world pays once - destroyed again after a restoration it pays nothing (default)
		#false - a flat reward by the world's tier
		progressionScaledDestructionTp = true
		#Whether a destroyed star will leave a black hole behind. Not in this version yet: a destroyed star goes supernova and
		#disappears whatever this says; the value is kept for when it does.
		#true  - yes (default)
		#false - the star just disappears
		starsCollapseIntoBlackHoles = true

	#DragonMineZ Super (dmzsuper).
	#DragonMineZ itself hands the Beerus planet to this mod: its own space pod
	#destination 'beerus' points at the dimension dmzsuper:beerus_planet. With
	#dmzsuper installed our planet would be a second, identical-looking entry.
	#true  - unlock our Beerus planet as well
	#false - leave the planet to DragonMineZ Super (default)
	[compatibility.dmzsuper]
		beerusPlanet = false
		#DragonMineZ Super also defines the groups ultraego and ultrainstinct,
		#with the same group and form names as ours but different values. Whichever
		#writes last wins.
		#true  - install our versions of those two groups
		#false - leave them to DragonMineZ Super (default)
		forms = false

#Flight.
[flight]
	#How fast Combat Flight sinks when you hold neither ascend nor descend,
	#in blocks per tick.
	#DragonMineZ hard-codes 0.05, which is a block a second downwards - so holding
	#jump is not how you climb, it is how you avoid falling. Aiming, charging and
	#dodging all happen during a permanent slow descent.
	#0.0  - hold your height (default). Search Flight stays the fast way to travel,
	#       Combat Flight becomes the one you fight in.
	#0.05 - DragonMineZ' behaviour.
	#Anything in between works; the value is used as-is.
	#Range: 0.0 ~ 1.0
	combatFlightSink = 0.0
	#How many ticks the flight aura keeps burning after the sprint
	#threshold drops, in ticks.
	#DragonMineZ switches the aura by 'fly skill active AND sprinting AND faster
	#than 0.65 blocks per tick', re-decided every server tick. It does fade out
	#rather than cut, but there is no hold - every corner, every brake, every
	#moment the speed grazes the threshold turns the fade around, so a short burst
	#never reaches full brightness.
	#20 - one second of hold (default). 0 - DragonMineZ' behaviour.
	#This is render-only: the aura you see is held, nothing else. The server flag
	#also grants the turbo speed bonus and the aura light level, and neither is
	#touched here.
	#Range: 0 ~ 200
	auraLatchTicks = 20
	#How many aura particles sweep back from a flying player per tick.
	#This is the anime silhouette: the ki aura is not a flame standing over your
	#head while you fly, it lies back along the body into a plume. Built from
	#DragonMineZ' own aura particle at DragonMineZ' own measurements - ring radius
	#0.15 to 0.60 of the body scale, two blocks long, tapering towards the tail.
	#DragonMineZ spawns 0 to 2 of these per tick for a standing aura, and only for
	#whitelisted players, so nothing is drawn twice.
	#2 - a steady plume (default). 0 - off.
	#Range: 0 ~ 12
	auraSweepPerTick = 2
	#Size of the swept aura particles, as a multiple of the body scale.
	#1.0 is DragonMineZ' own size for its standing aura (default).
	#Range: 0.1 ~ 4.0
	auraSweepScale = 1.0
	#How many fine ki motes a flying player leaves per tick.
	#DragonMineZ' own ki_trail particles - the same specks its ki attacks shed -
	#tinted with that player's aura colour. They are the speed lines next to the
	#plume. Nothing here is drawn as geometry, so it stays inside the game's own
	#visual language, and none of it needs network traffic: everyone's position is
	#known anyway.
	#2 - a thin stream (default). 0 - no motes.
	#Range: 0 ~ 12
	trailsPerTick = 2
	#How large the trail particles are.
	#DragonMineZ' own scale factor: the particle picks a random size between 0.1
	#and 0.4 times this value, so it is a ceiling rather than a fixed size.
	#0.6 - clearly visible, not loud (default).
	#Range: 0.05 ~ 3.0
	trailScale = 0.6
	#How fast a flying player has to move before a trail appears, in blocks
	#per tick.
	#Gates both the plume and the motes. Deliberately not tied to DragonMineZ' aura
	#switch: that one also demands the sprint key and 0.65 blocks per tick, so
	#anything hung on it would stay invisible most of the time.
	#0.35 - a brisk flight (default). Lower means effects almost always.
	#Range: 0.0 ~ 3.0
	trailMinSpeed = 0.35

#The DragonMineZ space pod menu.
[spacePod]
	#Whether a trip picked in the space pod menu is shown as a voyage.
	#DragonMineZ moves you in an instant: a loading screen, and you sit in a pod
	#in the other world at the height you left from - inside a hill or high over
	#the sea, as it happens.
	#true  - the pod lifts off and climbs out of sight, flies through space to the
	#        planet, then comes down out of the sky onto the ground of the world you
	#        picked (default). About ten seconds; nothing can hurt you meanwhile.
	#false - DragonMineZ' instant trip, unchanged.
	#Places with fixed coordinates (Otherworld, the Time Chamber, Beerus' planet)
	#keep them either way; the pod comes down onto them from only as high as there
	#is open air.
	voyageCinematic = true

#The twelve universes in deep space.
[multiverse]
	#Whether the Galaxy Atlas can send a space pod to another universe.
	#true  - the atlas gets a row of the twelve universes; pick one and the pod is
	#        carried there through a wormhole. The atlas and the autopilot then chart
	#        and fly that universe as they do the home one (default).
	#false - the other universes are reached through Whis, the Angel Staff and black
	#        holes only.
	podUniverseJump = true
	#Whether the pod's universe jump waits for the story.
	#false - anyone who may fly in deep space may jump (default).
	#true  - only after the Universe 6 against Universe 7 bout, as Whis's ferry does.
	podJumpNeedsUniverse6Arc = false
	#Whether a long leg of the pod's autopilot is folded.
	#true  - a leg of more than 900 blocks in deep space is crossed at once after a
	#        moment of cruise, hidden in the autopilot's own streak and flash (about two
	#        seconds, no wormhole); the autopilot flies the last stretch and announces
	#        the arrival as always (default).
	#false - the autopilot flies every block of the way (a long leg faster, about half
	#        a minute at most).
	podAutopilotFold = true
	#Where the seven Super Dragon Balls lie.
	#true  - scattered across Universe 6 and Universe 7, as in the story: the world's
	#        seed sends three or four of them to Universe 6, the rest stay in Universe 7.
	#        The radar tells which universe each one is in (default).
	#false - all seven around the home system.
	#Balls already recovered stay recovered either way.
	superDragonBallsAcrossUniverses = true
	#What black holes do to whoever flies into one.
	#true  - they are a way through: the traveller falls in unharmed and is thrown out
	#        above a world of another universe (default). Each player chooses how much
	#        of the fall they are shown with /dmzultra animations blackhole.
	#false - they drain ki and stamina and kill whoever stays inside the horizon.
	blackHolesLeadElsewhere = true

#The Gods of Destruction and Angels of the other eleven universes, on their sanctuaries.
[divine]
	#Whether the other eleven Gods of Destruction take candidates.
	#true  - the Destroyer Path can be walked under any of them, each universe with
	#        its own seat and apprentices; a player still holds one office in one
	#        universe (default).
	#false - they only talk; the Destroyer Path is Beerus's alone.
	#Offices already held in another universe are kept either way. The Destroyer Path
	#is not available in this version of DMZ Ultra; this waits for DMZ Ultra's own.
	otherDestroyerPaths = true
	#Whether the angels of the other eleven universes take the Angel Path's oath.
	#true  - any angel can be one's teacher (default).
	#false - only Whis teaches. Whoever already has another teacher keeps them.
	otherAngelsTeach = true
	#Whether each of the other eleven Gods of Destruction asks something of his own
	#of a candidate before taking them as his apprentice (Champa a feast, Quitela a
	#wager, Liquiir a run ...), beside the Destroyer Path's three trials.
	#true  - the god's demand must be met before the apprenticeship (default).
	#false - only the path's trials are asked, as under Beerus. Demands already met stay met.
	godsDemands = true
	#Whether each of the other eleven angels gives a lesson of their own - a small
	#drill on their sanctuary's ring - to whoever walks the Angel Path, whoever their
	#teacher is. Every lesson learned brings the Angel Staff's powers back 4% sooner.
	#true  - lessons are given (default).
	#false - none are given; lessons already learned keep their worth.
	angelLessons = true
	#Whether each sanctuary shows who holds its seat: a board on the landing terrace
	#(the universe, its god and angel, the holder of the seat, the seats held among
	#the twelve) and the holder's name over the god's seat. Both are Minecraft's own
	#text displays, kept up to date while somebody is on the sanctuary.
	#true  - shown (default).    false - not shown; those that stand are taken away.
	seatBoards = true

#Melee with something in hand (DragonMineZ' M1 combat).
[meleeWeapons]
	#Whether a hit with anything in the main hand is a DragonMineZ hit.
	#DragonMineZ computes a punch from your STR, and a hit with a weapon it knows
	#(swords, axes, tridents and the like) from your STR and that weapon's attack -
	#but with anything else in hand (a pickaxe, a shovel, a hoe, a block, a stick)
	#it leaves Minecraft's own damage, so a fighter with thousands of STR hits like
	#anyone else.
	#true  - such a hit counts as a punch: your STR, as with an empty hand (default).
	#false - DragonMineZ' behaviour unchanged.
	heldItemsUseStrength = true
	#How much a better weapon adds to a DragonMineZ hit.
	#DragonMineZ' melee damage comes from STR alone, so a wooden and a netherite
	#sword hit the same. This adds a share per point of the item's own attack
	#damage (its +N attack damage in the tooltip): with 0.05 a diamond sword (+6)
	#hits 30% harder, a netherite axe (+9) 45%; damage enchantments add their
	#bonus the same way. Ki weapons scale with ki and are left alone.
	#0 turns it off.
	#Range: 0.0 ~ 0.25
	weaponPowerPerPoint = 0.05
	#The most a weapon can add this way (0.6 = +60%), so modded weapons with huge numbers stay sane.
	#Range: 0.0 ~ 3.0
	weaponPowerCap = 0.6
	#Whether vanilla weapons and the ki weapons swing DMZ Ultra's own combos.
	#true  - swords, axes and the trident, and the ki blade, scythe and claw lance,
	#        each get a combo of their own with their own animations (default).
	#        A ki weapon whose combo you set yourself in DragonMineZ' combat.json
	#        keeps yours.
	#false - DragonMineZ' combos for all of them.
	customCombos = true

#Lock-on targeting.
#Who can be locked stays DragonMineZ' decision: the kisense skill, its range
#of 15 + 5 per level (+25 when android-upgraded), cloaked players, god forms
#and Taiyoken blindness all keep working exactly as before. Only the choice of
#target among those changes.
[lockOn]
	#Half-angle of the search cone in degrees, measured from where you look.
	#DragonMineZ casts a single ray down the crosshair, so a target has to sit
	#almost exactly under it and the nearest one along that ray always wins - a
	#saibaman in front hides the boss behind it.
	#45.0 - the quadrant in front of you (default).
	#Small values approach DragonMineZ' behaviour, large ones let targets behind
	#your shoulder in.
	#Range: 1.0 ~ 90.0
	coneDegrees = 45.0
	#How much battle power counts when several targets are in the cone.
	#The bonus is capped at a hundredfold difference either way and is worth at
	#most this value, so it decides near-ties and can never pull the lock off
	#something you are clearly aiming at.
	#0.5 - a tenfold stronger opponent wins ties worth about 9 degrees (default).
	#0.0 - angle and distance only.
	#Range: 0.0 ~ 5.0
	powerWeight = 0.5
	#How many ticks a lock survives losing line of sight.
	#DragonMineZ drops the target the moment anything comes between you, which in
	#a fight means every pillar, every dash behind cover.
	#40 - two seconds (default). 0 - drop it at once, as DragonMineZ does.
	#Everything else still applies during the grace: range, cloak, death and
	#Taiyoken end the lock immediately.
	#Range: 0 ~ 200
	occlusionGraceTicks = 40

#Majin absorption.
#DragonMineZ grants four percent of the target's max health as a flat bonus on
#STR, SKP and PWR. Against a saga fighter that is a few dozen points against
#your thousands - it happens, but nobody ever feels it. This is a multiplier
#on every stat instead, active only while an absorbed form is worn.
[absorption]
	#How much of the absorbed fighter you keep, as a share of their stats.
	#Against a player this is exactly that: a quarter of their STR, SKP, RES, VIT,
	#PWR and ENE. An NPC carries a battle power but no stat spread, so the stats
	#are read back out of DragonMineZ' own curve - bp = 1200 * (rawPower/100)^1.2,
	#inverted. Its reference value of 1200 is Raditz' scouter reading, so the
	#numbers land where the anime put them: Raditz 20 per stat, Nappa 55, Vegeta
	#of the Saiyan saga 243, Mecha Frieza 10082.
	#Every absorption you carry counts, worn or not - a Majin gets stronger by
	#eating, not by changing clothes. Which one you wear is looks alone.
	#One absorption is capped at half your own value for that stat, so the three
	#DragonMineZ allows add up to +150 percent at most. Without the cap Perfect
	#Cell alone would hand you 797080.
	#The numbers are measured once, when you absorb, and stay put.
	#0.25 - a quarter (default). 0.0 - off.
	#Range: 0.0 ~ 2.0
	statShare = 0.25

#God Ki.
#DMZ Ultra makes God Ki (godkienhancement) a reward rather than a skill to buy: complete the
#God Chamber trial with Whis (after the first Godfall quests) and God Ki is unlocked for good.
[godki]
	#true  - God Ki can also be bought from Whis with training points.
	#false - God Ki can only be earned in the God Chamber (default). Higher God Ki levels, if
	#        any are offered, are still bought the usual way once you own the first.
	godKiPurchasable = false

#Restored planets.
#A planet that was destroyed and then restored (Angel Staff) grows back by itself:
#RESTORED, REBUILDING, CIVILIZATION, DEVELOPED. From REBUILDING on, buildings are placed on its surface
#(once somebody has visited it) and inhabitants move in. Planets are destroyed, and so restored, only
#while space.wave2.destruction is on in dmzultra-space.toml.
[civilization]
	#false turns the whole system off; planets then stay as they were restored.
	enabled = true
	#Minutes of server time a planet spends in each stage before it grows into the next one.
	#Range: 1 ~ 1440
	stageMinutes = 15

#Realistic progression (/dmzultra realistic progression on|off). Realistic mode is not available in this
#version of DMZ Ultra: these options wait for it.
[realistic]
	#Whether DMZ Ultra's own forms join the realistic scale.
	#true  - in realistic mode every DMZ Ultra form gets a story-scale multiplier
	#        (hundreds to thousands) and its form skills are priced like forms of the
	#        same strength (default).
	#false - DMZ Ultra's forms keep their normal multipliers and prices even in
	#        realistic mode.
	dmzUltraForms = true
	#Scales the realistic multipliers of DMZ Ultra's forms (1.0 = as designed).
	#Range: 0.1 ~ 10.0
	dmzUltraFormScale = 1.0

#Things that happen to players without their asking: invasions and raids on Earth,
#and an ambush for those who land on a world of another universe.
[worldEvents]
	#false turns every one of them off (an operator can still start one with /dmzultra event).
	enabled = true
	#How long, on average, a player is out under Earth's open sky before an event
	#finds them (a Frieza Force invasion, a Red Ribbon raid, a Saibaman outbreak).
	#In minutes; a higher number makes them rarer.
	#Range: 5.0 ~ 100000.0
	earthEventMinutes = 45.0
	#The chance that landing on a world of another universe brings its sentinels
	#down on the visitor (0 = never, 1 = every landing).
	#Range: 0.0 ~ 1.0
	ambushChance = 0.35
	#Minutes a player is left alone after an ambush before another landing can bring one.
	#Range: 0.0 ~ 100000.0
	ambushQuietMinutes = 15.0
	#How strong an event's foes are, as a share of the battle power of the player
	#the event came for (100 = their equal). Later waves and officers are a little
	#above it, a Saibaman outbreak well below.
	#Range: 5.0 ~ 1000.0
	powerPercent = 70.0

#Taking or freeing a world as a campaign in acts: landfall, breaking its defences,
#its champion, and planting your standard. The world's planet mission decides who
#owns it and what it pays. A campaign begins only while space.wave2.missions is on
#in dmzultra-space.toml.
[conquest]
	#false - no campaign: a world is taken by its planet mission alone.
	campaign = true
	#full  - every act (default)
	#waves - only waves of foes and the champion: no pylons, seed beds, cages or captains to hunt
	acts = "full"
	#How many foes a campaign brings, as a factor on the default (1.0). How strong each is: see scaling.
	#Range: 0.25 ~ 4.0
	foesMultiplier = 1.0
	#What a campaign's foes are measured against:
	#party - the fighters who are there (default). The strongest of them is the anchor: a
	#        trooper takes about four of their basic blows, a squad's leader nine, a defence
	#        twenty-two, the champion ninety, and a blow of theirs costs the anchor 3 to 8.5
	#        percent of their health. More fighters: more foes with more health, never more
	#        damage. The world's tier is how far above the party it stands (+12 % health and
	#        +7 % damage a tier). No blow costs any player more than a share of their own
	#        health (9 % a trooper's, 26 % the champion's).
	#tier  - the world's tier alone: the world's own numbers times the campaign's role
	#        factors (as it was before DMZ Ultra matched worlds to their visitors).
	#off   - the world's own numbers and nothing else.
	scaling = "party"
	#Factor on the health of a campaign's foes and defences when scaling = party (1.0 = the rule as described).
	#Range: 0.25 ~ 8.0
	foeHealth = 1.0
	#Factor on what a campaign's foes deal when scaling = party (1.0 = the rule as described). The cap a blow moves with it.
	#Range: 0.25 ~ 4.0
	foeDamage = 1.0
	#true  - with scaling = party a world is never weaker than its own numbers for its
	#        tier: matching only raises it. A fighter below a world's tier meets the health
	#        that guards that tier's pay (only the one-blow kill is taken away).
	#false - every world is matched to whoever comes, also downwards. A world still pays
	#        by tier, so a high world then pays a weak visitor as much as a strong one.
	noeaFloor = true
	#true  - some worlds are of a kind of DMZ Ultra's own, laid over the world's faction and always
	#        the same for one world: Saiyan worlds (three in ten Frieza Force occupations, one
	#        in four Saibaman colonies) whose fighters come in attack pods and whose champion
	#        becomes a Great Ape; and worlds an elite squad keeps (three in twenty Frieza Force
	#        occupations of Universe 7): no waves - the Ginyu Force one at a time, then their
	#        captain.
	#false - every world is only what its faction says.
	kinds = true
	#true  - after the champion falls the world is claimed by planting a standard on the landing plateau
	#false - the world is claimed the moment the champion falls
	plantTheFlag = true
	#Whether a claimed or freed world keeps a monument with its holder's standard and a small garrison.
	lastingMarks = true

#How strong the foes are that the mod sends at a player outside a campaign. For each
#family:
#party  - matched to the fighters who are there (default): a foe's health is counted in
#         the basic blows of the strongest of them and its blow in their health, so
#         nobody brings it down in one punch and it brings nobody down in one. A foe
#         struck by someone stronger at base than it was made for - a stronger friend,
#         not a transformation - rises to them (four fifths of the gain, its health bar keeping its
#         share). More fighters: more health, never more damage. No blow costs any player
#         more than a share of their own health.
#legacy - a share of the player's battle power, as it was (from the middle of the game
#         on every such foe falls to one or two punches and cannot hurt the player).
#Bouts with a declared strength - a roster fighter at his own, half or twice his own
#power, a tournament at the roster's true power - are never matched.
[scaling]
	#Invasions, raids, outbreaks and ambushes. party: a soldier takes four to five basic
	#blows, an officer about eighteen; a blow of theirs costs 2 to 7 percent of health.
	#worldEvents.powerPercent then scales the rule (70, its default, is the rule as described).
	worldEvents = "party"
	#The waves of the God Chamber and the Room of Spirit and Time: the God Ki trial,
	#training, the Angel Path's drills, the angels' lessons, a god's show. party: at 100
	#percent a foe takes five basic blows; the percent a run is set to scales that (25: two
	#blows, 400: twenty), and training below 100 percent pays in proportion.
	chamber = "party"
	#A spar "matched to you" - a master's, a god's demand, an angel's bout. party: a duel
	#of 32 basic blows against about 14 of theirs. Easy and Hard (half and twice the
	#fighter's own power) are not touched.
	sparring = "party"
	#Factor on the health of every foe matched by this section (1.0 = the rule as described).
	#Range: 0.25 ~ 8.0
	foeHealth = 1.0
	#Factor on what such a foe deals (1.0 = the rule as described). The cap a blow moves with it.
	#Range: 0.25 ~ 4.0
	foeDamage = 1.0
	#true  - every foe sized to a player (this section, campaigns, arenas, tournaments, the
	#        chambers, matched spars and raids) is sized to the player's
	#        BASE power: their stats with their normal growth, without forms, stack forms,
	#        Kaioken, power release or timed buffs. Transforming then makes the player
	#        stronger than the foe. The scouter and the HUD still show the transformed power.
	#false - foes are sized to the player's power as it stands (transformed), as before.
	basePower = true

#Diagnosis.
[diagnosis]
	#Counts every mob spawn and writes one summary line per minute,
	#broken down by entity and by the reason Forge gives: NATURAL is the world
	#spawning by itself, CHUNK_GENERATION is a herd placed when the terrain was
	#made, SPAWNER is a block, MOB_SUMMONED and COMMAND are somebody's code.
	#Counting what stands around only says how much accumulated - this says what
	#is arriving, and from where.
	#false - off (default). Turn it on when something is multiplying.
	spawnWatch = false

#Transformation scenes (each player turns them on for themselves: /dmzultra animations transforms on).
[scenes]
	#Whether a player who has their scenes on transforms with ONE press of the transformation key:
	#the scene plays, and the form is taken at its burst - about four seconds after the press the
	#first time a form is taken, about one second every time after. The conditions, costs and
	#refusals are DragonMineZ' own, checked on the server exactly as for a completed hold.
	#false - the key must be held as DragonMineZ has it, with or without scenes (a hold is 4 to 10
	#seconds; turn this off where the shorter wait would be unfair).
	onePress = true

#The Angel Staff (divine/AngelStaff, divine/staff).
[staff]
	#Whether the Orb's Sight may rest on somebody outside the bearer's own party.
	#true  - on a server without PvP anybody online may be watched (they are told);
	#        on a server with PvP only the party, whatever this says (default).
	#false - only the bearer's own party, everywhere.
	watchStrangers = true
	#Whether Stillness can be used on players. It never can on a server without PvP,
	#nor on somebody the bearer could not harm; where it can, it lasts two seconds and
	#nobody is stilled twice within half a minute.
	#false - Stillness is for creatures only.
	stillPlayers = true

#Planet Vegeta, the home of the Saiyans, in Universe 7 (vegeta/VegetaWorld).
[vegeta]
	#Whether Planet Vegeta exists: a red world of Universe 7 with the Saiyan capital on
	#it, reached by space pod like Namek (and, once DMZ Ultra has its own space system,
	#charted east of Earth on the Galaxy Atlas and in the Multiverse menu).
	#true  - it is there (default). A world that was begun without it gets it too.
	#false - it is not added to space and nothing leads there. (Read when the game
	#        starts: a change needs a restart.)
	enabled = true
	#The gravity of Planet Vegeta, in DragonMineZ' own measure (1 = Earth's). It is
	#written into DragonMineZ' table of worlds, so its own rules apply there: what a
	#fighter's strength does not cancel slows them and weakens them a little, and
	#training under it pays more TP. The planet is famous for ten times Earth's.
	#10 - ten times (default).    1 - as on Earth.
	#Range: 0.0 ~ 500.0
	gravity = 10.0
	#Whether Saiyans live in the capital: the Prince in the throne hall, Nappa on the
	#training ground, Raditz on the landing field, and warriors in the streets who
	#leave a visitor alone until they are attacked.
	#true  - they are there (default).    false - the capital stands empty (the Royal
	#        Proving, which the Prince grants, cannot be asked for then).
	residents = true
	#Whether the ground of Planet Vegeta (its capital, its fields and its sky) cannot be broken by ki
	#attacks and impacts: no crater, no tunnel, no flattened city, whoever fires and however strong.
	#Players' pickaxes are not affected, and nothing else about a fight changes.
	#true  - the ground holds (default).    false - ki breaks blocks there as it does elsewhere.
	kiProof = true

#Bio-Android strains (genome/GenomeEvents).
[genome]
	#Whether a Bio-Android also takes strains from the fighters of the waves (the chambers' waves, world
	#events - the ones raised for them) and from the world's own wild fighters (Namekian warriors, bandits, Red Ribbon
	#soldiers, the living world's fighters ...), by the fighter's race. A chance per defeat, lower than for a player or
	#a quest boss, from fighters not far weaker than the Bio-Android; at most one gain per 20 minutes.
	#true  - they count (default).    false - only players and quest bosses give strains.
	wildFighters = true

#The Gods of Destruction's worlds (multiverse/KiProofWorlds).
[destroyers]
	#Whether the ground of Beerus' planet (DMZ Ultra's or DragonMineZ Super's) and of the sanctuaries of the other
	#Gods of Destruction cannot be broken by ki attacks, impacts and explosions - however strong the blow, whoever
	#throws it. Fighters are hurt and thrown as always; only the blocks stay.
	#true  - they hold (default).    false - ki breaks blocks there as it does elsewhere.
	kiProof = true

#The Room of Spirit and Time (multiverse/KiProofWorlds).
[timeChamber]
	#Whether the Room of Spirit and Time (DragonMineZ' time chamber, with Mr. Popo's palace) cannot be broken
	#by ki attacks and impacts, so that a long training session does not leave it a ruin.
	#true  - the room holds (default).    false - ki breaks blocks there as it does elsewhere.
	kiProof = true

#The guide: the index (/dmzultra index) and the two-minute tour.
[guide]
	#Whether players are offered the two-minute tour (a small card) the first time they join: once per session,
	#three sessions at most, and never again after they start or skip it.
	#true - offered (default); false - nobody is offered it; /dmzultra index and /dmzultra index tour still work.
	offerTourOnFirstJoin = true

#Travel: Beerus's planet, the Angel Staff's Passage, Whis's and Zeno's travel lists, retired worlds.
[travel]
	#Whether finishing DMZ Ultra's Beerus Saga quest 5 ("God against God") unlocks Beerus's planet of another add-on that
	#keeps one (DragonMineZ Super) - its space pod entry, the Angel Staff's way there, Whis's list - for the player and their
	#party. Players who finished it before are given it when they next join. DMZ Ultra's own planet always opens by the story.
	#true - the story opens it (default).    false - only that add-on's own ways open it.
	beerusSagaUnlocksPlanet = true
	#The Angel Staff power from which Beerus's planet is a destination of the Passage, for every bearer (the planet must be
	#unlocked as for the pod). 1 = as soon as Whis hands out the staff (default); up to 7.
	#Range: 1 ~ 7
	staffBeerusPower = 1
	#Whether Whis and Zeno offer Beerus's planet on their travel list once it is unlocked.
	#true - they do (default).    false - the space pod and the Angel Staff are the ways there.
	whisOffersBeerusPlanet = true
	#While another add-on keeps Beerus's planet (DragonMineZ Super), DMZ Ultra's own planet (dmzultra:beerus_planet) stays
	#registered so old worlds load, but nothing leads there any more.
	#Whether a player found inside it (joining, respawning, arriving) is moved to that add-on's planet.
	#true - moved (default).    false - left where they are (an operator brings them out).
	moveFromRetiredWorlds = true

#DragonMineZ' quest numbers under DMZ Ultra's inserted quests (com.dmzultra.r3.top).
[tournament]
	#DMZ Ultra inserts its own quests into DragonMineZ' sagas, which moves the numbers of DragonMineZ' quests in the world.
	#DragonMineZ' own space pod rules and the Locked Transformations add-on still name the original numbers. With this on
	#they are read as the quest that number had before the insertions.
	#true - the gates answer for the true quest (default).    false - the literal number is read (the old behaviour).
	translateQuestNumbers = true

#Sparring partners and realistic mode (0.3 area "spar").
[sparring]
	#Whether DMZ Ultra's enemies join realistic mode's story scale. Without this, every fight of DMZ Ultra's sagas and
	#side quests keeps its normal health and damage while the fighter carries story-scale forms. With it, a quest foe of
	#DMZ Ultra's content is scaled by its quest's place on the curve (its level gate).
	#true - on (default).    false - DMZ Ultra's enemies stay at x1 in realistic mode.
	#(Realistic mode is not available in this version of DMZ Ultra: these options wait for it.)
	realisticEnemies = true
	#Scales the realistic factor of DMZ Ultra's enemies (health and damage). 1.0 = the curve as shipped;
	#0.5 = half of that, gentler; 2.0 = twice.
	#Range: 0.1 ~ 10.0
	dmzUltraEnemyScale = 1.0
	#Foes DMZ Ultra already fits to the fighter (spars matched to you, arena fighters, world events, God Chamber waves,
	#bounties, conquest foes, Planet Vegeta's guards) under realistic mode.
	#EXEMPT - they keep our own measure (so many of the fighter's real blows), realism does not multiply them again (default).
	#SCALED - realism multiplies them like any other enemy, on top of the fit.
	#Allowed Values: EXEMPT, SCALED
	matchedFoes = "EXEMPT"
	#Whether the last fight of each DMZ Ultra saga pays a realistic milestone (one payout sized to the next form's
	#realistic price, instead of the quest's normal TP) while realistic mode is on.
	realisticMilestones = true
	#Whether transformation lines made with DMZ Ultra's Form Creator join the realistic scale: their multiplier is put
	#through the same curve as DMZ Ultra's own forms (x1.35 -> x50, x4.4 -> x1600 ...). false - they keep their normal multiplier.
	ownerForms = true

[release]
	#Who nothing can harm while they stand through a transformation scene (they cannot move for it):
	#first - only the very first time a player awakens a form (default; kept with the character, "watch again" does not give it back);
	#long - every time the long scene is shown (what 0.2.x did; on a PvP server this is an escape button);
	#never - nobody: a struck fighter is never frozen, the long scene lets them go right after its burst.
	#A player struck in the last fifteen seconds is never kept safe and gets the short scene.
	sceneSafety = "first"
	#true: at their first login with 0.3 a player who owned a form that was moved to a level of its own (Supernova, Nebula, Dragon Clan ...)
	#is raised to its new level for free (they had paid for it). false: nothing is given; they buy the level again.
	renumberGift = true
	#true: a Black Flash takes the striker's camera for the blow (they are free to move again right after the fist, and moving hands the camera back).
	#false: nobody's camera is taken - everybody, the striker too, sees the blow from where they stand.
	#The one struck never loses their camera or controls in either case.
	blackFlashCamera = true

#Ultra Combat - strings, heavies, parries, hit-stun, telegraphed NPC blows (0.3 area "combat").
[combat]
	#Which melee system runs for empty hands.
	#ultra - DMZ Ultra's Ultra Combat: a light string of five (the fifth knocks away), hold the attack to charge a heavy,
	#        hit-stun with an anti-infinite budget, parries that punish, telegraphed saga blows you can parry (default);
	#dmz   - DragonMineZ' own combat exactly as it ships (only the i-frame fix below still follows its own switch).
	system = "ultra"
	#Vanilla invulnerability frames swallow every second bare-hand blow of DragonMineZ' combat at full speed (the hits
	#come 8 ticks apart, the game drops an equal hit within 10). With this on, every blow DragonMineZ' combat lands is
	#counted - in both systems. It roughly doubles DragonMineZ' bare-hand damage per second at full click speed, and with
	#it the stamina those blows cost, Battle Focus stacks and the per-hit stat sync.
	#true - every blow counts (default).    false - vanilla's rule.
	fixHitCooldown = true
	#Whether a player may switch their own attacks back to DragonMineZ' combat with /dmzultra combat classic on
	#(as a defender they still meet Ultra Combat's blows).
	playersMayChooseClassic = true
	#Whether Ultra Combat is used between players. false: a player who hits another player swings DragonMineZ' combat.
	pvp = true
	#Whether saga fighters fight by Ultra Combat's rules: their punches show a wind-up (a glint on the fist and a cue
	#sound) so they can be parried, they are held in hit-stun by a string, and they may guard a string.
	npcToolkit = true
	#Ticks a saga punch is shown before it lands, by the fighter's AI tier (plus the victim's one-way
	#latency, at most latencyDelayMaxTicks). A saga swings every 20 ticks, so keep these under 17.
	#Range: 4 ~ 16
	npcWindupSimple = 12
	#Range: 4 ~ 16
	npcWindupTactical = 9
	#Range: 4 ~ 16
	npcWindupAdvanced = 7
	#The hit-stun one combo may hold a fighter in, in ticks. When it is spent, blows still land but no longer hold:
	#the chain is broken and the fighter can answer.
	#Range: 10 ~ 200
	hitstunBudgetTicks = 50
	#Damage of each blow of a combo, by its place in the combo (the last value holds for every later blow).
	comboScaling = [1.0, 1.0, 0.95, 0.9, 0.85, 0.8, 0.7, 0.6, 0.5, 0.45, 0.4, 0.35]
	#Ticks a fighter whose blow was parried can do nothing (and takes 20 % more damage).
	#Range: 0 ~ 60
	parryPunishTicks = 14
	#Ticks after a parry in which the parrying fighter's first blow is a Counter (+30 % damage).
	#Range: 0 ~ 60
	counterWindowTicks = 14
	#The most a telegraphed blow (a charged heavy on a player, a saga punch) is held back for the defender's one-way
	#latency, so a player with a slow connection still sees the whole wind-up. The parry window itself never changes.
	#Range: 0 ~ 6
	latencyDelayMaxTicks = 3
	#Random dodges (a form's dodge, Angel's Grace, True Ultra Instinct, DMZ Overhaul's speed evasion) may
	#only spoil the first blow of a combo or a heavy; inside a confirmed string they stay quiet. A dodge shows as a vanish.
	#Only while combat.system is ultra (DragonMineZ' combat keeps the old odds).
	#true - only openers and heavies (default).    false - any blow, as before.
	randomDodgesOnOpenersOnly = true
	#Ticks True Ultra Instinct waits after a dodge before it can dodge again (it used to roll 75-90 % on every blow).
	#Only while combat.system is ultra.
	#Range: 0 ~ 400
	tuiDodgeCooldownTicks = 30
	#While a fighter is held in Ultra Combat's hit-stun, DragonMineZ' dash and Perfect Evasion and a saga fighter's
	#zanzoken, evasion and wild-sense teleport wait, and so do a player's ki techniques, ki blasts and strikes (a technique being
	#charged is dropped) - a string is not broken by a free reflex; a paid breaker (Ki Burst) comes later.
	holdBackEvasionInHitstun = true
	#True combos: while a player is held in Ultra Combat's hit-stun by a chain that is not broken yet, DragonMineZ' guard
	#does not count against the blows of a striker in that chain (no block, no parry) - the anti-infinite budget
	#(hitstunBudgetTicks) still ends the chain, and the guard counts again.
	#true - true combos (default).    false - the guard counts on every blow, as before.
	trueCombos = true
	#Stage 2 of Ultra Combat: the directional heavies (forward Rush Elbow, back Sky Splitter - a launcher -, sneak Quake
	#Sweep), Rising Chase and the air string, Meteor Drop, knock-downs, the pursuit through DragonMineZ' Dash, saga posture
	#and its break, the saga fighters' guard / hit / launch bodies, hit-stop and impact frames.
	#true - on (default).    false - stage 1 only (the light string and the Breaker Fist).
	#(Named stage2Moves since 0.3.3: the old key "stage2" was written false by 0.3.0 while stage 2 was unfinished.)
	stage2Moves = true
	#Stage 2. The pursuit: after a knock-away (the fifth light, Comet Kick) or a charged Breaker Fist, DragonMineZ' Dash
	#teleports you behind the fighter you knocked away for a moment (its own dormant pursuit window), and your next blow
	#on it deals 15 % more. A place that does not fit (a wall) is replaced by a free one beside the fighter.
	pursuit = true
	#Stage 2. How many launchers (Sky Splitter: back + heavy) may throw one fighter up in one combo; later ones land as plain
	#heavies.
	#Range: 0 ~ 10
	maxLaunchersPerCombo = 2
	#Stage 2. After a knock-down (Quake Sweep, Meteor Drop) the fighter gets up and no blow struck in reach lands on it
	#for this many ticks more (it lies untouchable while down as well) - a knock-down ends the combo, it does not loop it.
	#Range: 0 ~ 60
	wakeUpImmunityTicks = 10
	#Stage 2. A saga fighter's posture, as a share of its health, by AI tier: simple, tactical, advanced, and a boss.
	#Ultra Combat's blows wear it down (by the health they take times the move's posture weight; guarded blows 1.5x);
	#at zero the fighter staggers, broken, and takes 25 % more for postureBreakTicks. It comes back 10 % a second.
	postureShares = [0.25, 0.3, 0.35, 0.4]
	#Stage 2. Ticks a saga fighter staggers when its posture breaks.
	#Range: 10 ~ 120
	postureBreakTicks = 40
	#Stage 2. DragonMineZ' impact frame (the screen-wide flash) on the two fighters' screens when a heavy lands, a
	#posture breaks or a guard is crushed. Each player's own DragonMineZ setting for impact frames still applies.
	impactFrames = true
	#Stage 3. Zanzoken Step: DragonMineZ' Dash pressed just before a telegraphed blow lands on you (a saga's wound-up punch, a
	#player's heavy) vanishes you behind the striker instead of dashing - its blow meets nothing, you are untouchable for a
	#moment. It costs ki (vanishKiCost of your most, more for each step soon after another) and is no way out of hit-stun.
	zanzokenStep = true
	#Stage 3. How early before the impact a Zanzoken Step may be pressed, in ticks (plus your one-way
	#latency, at most latencyDelayMaxTicks).
	#Range: 1 ~ 8
	vanishWindowTicks = 3
	#Stage 3. A Zanzoken Step's ki, as a share of your most ki.
	#Range: 0.0 ~ 1.0
	vanishKiCost = 0.06
	#Stage 3. Each Zanzoken Step within 3 seconds of the one before costs this many times more.
	#Range: 1.0 ~ 4.0
	vanishEscalation = 1.35
	#Stage 3. Ki Burst, the paid way out of a combo: guard (right mouse) pressed while held by a string, launched, knocked down
	#or stunned by a saga's combo bursts ki around you - the fighters at you are thrown back, their combo ends (a saga's
	#scripted combo too), and you are untouchable for half a second. It costs burstKiCost of your most ki and waits
	#burstCooldownTicks. Saga fighters burst too (by their AI tier, when comboed).
	kiBurst = true
	#Stage 3. A Ki Burst's ki, as a share of your most ki.
	#Range: 0.0 ~ 1.0
	burstKiCost = 0.2
	#Stage 3. Ticks between two Ki Bursts of one fighter.
	#Range: 20 ~ 6000
	burstCooldownTicks = 400
	#Stage 3. Saga fighters fight with a mind of their own (by AI tier and fighter - data/dmzultra/combat_moves/fight_styles.json):
	#they deflect and vanish from heavies they can read, follow a landed punch with a string of their own, pursue their
	#knock-aways, burst out of long combos, and read a player who repeats one string or turtles behind the guard. Never
	#frame-perfect (a reaction delay by tier).
	npcFighter = true

[cine]
	#true: players who turned their transformation scenes on may get the long compositions of 0.3 (nine to eighteen
	#seconds). false: everybody gets the short scenes of 0.2 (about seven seconds), whatever they chose - for a server where long
	#pauses in a fight are not wanted. A player in a fight gets the quick scene either way.
	longScenes = true

#The 0.3 space upgrade: flying a space pod by hand, the autopilot's arrivals, DMZ Ultra's own worlds in space travel.
[voyage]
	#How fast a space pod may be flown by hand in space, in blocks a tick: the sprint key opens the throttle up to this,
	#and the pod coasts down when it is let go. DragonMineZ' own pod flies 1.08 (21.6 blocks a second).
	#4.0 = 80 blocks a second (default). 0 = no boost: DragonMineZ' own flight, unchanged.
	#Range: 0.0 ~ 5.0
	podBoost = 4.0
	#Whether the autopilot may set a pilot down by itself when it arrives (always, with alwaysLand below; else each player
	#switches it on in the Galaxy Atlas). The landing's own checks still apply.
	#true - allowed (default).    false - arrivals always wait for the pilot to land.
	autoLandAllowed = true
	#Whether the autopilot always lands on the world it arrives at (owner, 30 Oct 2026): the Galaxy Atlas has no auto-land
	#switches any more, and the last stop of a course lands too. Still only where autoLandAllowed lets it.
	#true - always lands (default).    false - each pilot's own auto-land switches in the atlas, as before.
	alwaysLand = true
	#Whether DragonMineZ' pod menu leaves out DMZ Ultra's "Space above Earth" destination (owner, 30 Oct 2026: space is
	#reached by flying up in the pod). true - left out (default).    false - listed, as before.
	hideSpaceAboveEarth = true
	#Whether DMZ Ultra's own worlds (Planet Vampa, Planet Cereal, Planet Vegeta, the gods' sanctuaries) join space travel:
	#flying up out of them takes the ridden pod along and plays the atmosphere crossing.
	#true - they do (default).    false - flying up out of them is the plain way up to space.
	ownWorldLaunch = true
	#How many stops a pilot's course in the Galaxy Atlas may have (the autopilot flies them one after the other).
	#1 to 16, default 8.
	#Range: 1 ~ 16
	courseStops = 8
	#Whether a space pod flown by the autopilot leaves its aura and wake behind it (seen by everybody near).
	#true - it does (default).    false - the pod flies plain.
	podWake = true
	#Off-world keep-inventory: a player who dies in space, on a planet surface, on Namek, on the Sacred World of the Kai or on one
	#of DMZ Ultra's own worlds (Vampa, Cereal, Planet Vegeta, Beerus's planet, the sanctuaries) keeps their inventory and Curios.
	#The world's own keepInventory game rule still applies everywhere (Dragon Block Noea had this on; a world brought over from it
	#starts with DMZ Ultra's default). false - deaths off-world drop as anywhere else (default).    true - kept.
	offWorldKeepInventory = false
	#Seconds a player may drift in space without flight and without a vehicle before they are offered the way down to the
	#nearest world (they choose; nothing happens on its own). 0 = never offered. Default 60.
	#Range: 0 ~ 600
	strandedSeconds = 60

#Training mode: skills, ki techniques and Kaioken are learned from a master and then trained by doing them, instead of bought with TP.
#Transformations stay bought with TP. The switch is kept PER WORLD: /dmzultra training on|off (operators) sets it for the world it runs in;
#the first five values below are only what a world starts with the first time it runs with DMZ Ultra 0.3.
#Training mode stands down by itself when "Dragon Mine Z: Skill Progression" is installed (two mods must not both rewrite skill purchases).
[training]
	#A new world starts with training mode on (true) or off (false, default).
	enabled = false
	#In training mode, skills (Fly, Ki Sense, Ki Manipulation ... and Kaioken) are learned and trained instead of bought.
	skills = true
	#In training mode, ki techniques and strikes are learned from their master instead of bought (their upgrades already come from use).
	techniques = true
	#In training mode, stats can no longer be bought with TP: DragonMineZ' own Dynamic Growth trains them by fighting (it is switched on with this).
	#Pending attribute points still spend. DragonMineZ' own config file is never written: the answer is given per world.
	stats = false
	#How fast skills train: 2.0 halves every level's need, 0.5 doubles it. /dmzultra training speed sets it per world.
	#Range: 0.1 ~ 10.0
	speed = 1.0
	#What a master asks before teaching a lesson:
	#spar - win a spar against that master once (default; a master who does not spar teaches for free);
	#tp - pay the old price of the first level (the later levels are trained);
	#free - nothing.
	lessonRule = "spar"
	#true: a lesson is not learned on the spot - the master starts you on it and you practise first (charge ki, jump, cast ki attacks ...);
	#the skill's first level comes when the practice is done. false: a lesson gives level 1 at once.
	practiceGoals = true
	#The Ki Sense level Instant Transmission's lesson needs (the reference design used 10).
	#Range: 0 ~ 10
	instantTransmissionKiSense = 5
	#Training Focus: a learned skill's level can be partly filled by spending TP in the Skills menu (capped below).
	focus = true
	#Training Focus: XP per TP compared with the level's old price (0.5: a whole level would cost twice its old price).
	#Range: 0.01 ~ 1.0
	focusEfficiency = 0.5
	#Training Focus: at most this share of each level may come from TP.
	#Range: 0.0 ~ 1.0
	focusMaxShare = 0.5
	#Training Focus: at most this much TP per player per real day.
	#Range: > 0
	focusDailyCap = 50000
	#While training mode is on, form prices are multiplied by this (players no longer spend TP on skills, so forms come earlier; 1.25-1.5 evens that out).
	#Range: 0.1 ~ 10.0
	formPriceScale = 1.0
	#Training XP from blows on other players, compared with blows on foes (spars count; the repeat caps still apply).
	#Range: 0.0 ~ 2.0
	pvpShare = 1.0
	#Extra training XP while a party member within 24 blocks trained in the last 10 seconds (0.2 = +20%).
	#Range: 0.0 ~ 1.0
	partyBonus = 0.2
	#In training mode, what is still bought from a master (forms such as the god forms, and anything kept exempt) can only be bought
	#standing next to a master who teaches it. DragonMineZ' own purchase never checked that on the server. Outside training mode
	#nothing changes.
	purchaseNeedsMaster = true

	#Form training (rule "Breakthrough"): transformations are no longer bought with TP - each level of a form line opens by itself
	#once its form is mastered and a strong foe has been felled in it. OFF by default: forms are bought with TP unless a server owner
	#(or the owner of a single-player world) switches it on for a world in the DMZ Ultra Utilities, page "Training".
	#A line DragonMineZ sells only at a master (god forms at Whis or Beerus, Beast at Gohan, a stack line ...) still needs its master:
	#the earned level opens when the player presses Purchase at that master, never by itself nor from the Skills menu.
	#It works with or without training mode for skills. Nothing a player owns is ever taken away when it is switched on or off.
	[training.forms]
		#A new world starts with form training on (true) or off (false, default). Each world keeps its own switch afterwards.
		enabled = false
