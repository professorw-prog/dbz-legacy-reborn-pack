	#The Zeni of the flagship's find.
	#Range: 0 ~ 100000000
	flagshipZeni = 20000

#Speed of the living systems (QTK-1): a time budget for every living tick handler, packet counting, pulse work spread over ticks.
#Off or on, nothing here changes what the systems do - only how often and how smoothly they do it.
[livingPerf]
	#Master switch. Off: no timers, no throttling, whole pulses, state packets every 10 ticks (the behaviour before QTK-1).
	enabled = true
	#Time every living tick handler and compare it with its budget (/dmzultra living budget). A timer costs two clock reads a run.
	timers = true
	#A handler that stays over its budget for a whole window of runs may widen its own interval (never above maxStride times)
	#until it is back under budget. Only handlers that can be stretched safely (the pulse clock, the bonus poll) do this.
	throttle = true
	#The most a throttled interval is widened (2 = double, 4 = four times).
	#Range: 1 ~ 8
	maxStride = 4
	#Run a pulse's listeners one after the other on consecutive ticks instead of all in one tick. Off: the whole pulse in one tick.
	spreadPulses = true
	#Server-thread time one tick of a spread pulse may take, in microseconds (at least one listener always runs).
	#Range: 100 ~ 10000
	sliceMicros = 1000
	#Count the packets of the living channels (dmzultra:living, dmzultra:paths) per message and per player.
	packetMeter = true
	#Packets of one message to one player in one second above which the log says so (once per message).
	#Range: 2 ~ 400
	packetWarnPerSecond = 20
	#A state message (the travel event's panel) that has not changed is not sent again - only a heartbeat now and then.
	stateDedupe = true
	#Ticks after which an unchanged state message is sent anyway.
	#Range: 20 ~ 1200
	heartbeatTicks = 100
	#Scales every handler's budget (100 = the shipped numbers; 200 for a fast server, 50 for a weak one).
	#Range: 10 ~ 1000
	budgetPercent = 100

