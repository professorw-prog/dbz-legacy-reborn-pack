#a backup of it is written to <world>/dmzultra/slots/<uuid>/backup/ at its first login with this version.
[slots]
	#Character slots on (true, default). Off: nobody can switch or make a character; whoever is being played stays played,
	#and parked characters stay on disk untouched until the switch is turned on again.
	enabled = true
	#Characters every player has without paying.
	#Range: 1 ~ 8
	freeSlots = 3
	#The most characters a player can ever have (free + bought + wished + granted).
	#Range: 1 ~ 8
	maxSlots = 8
	#TP price of each extra slot past the free ones, in order (the last price repeats).
	extraSlotTpCosts = [1000000, 2500000, 5000000, 10000000, 20000000]
	#Extra slots can be bought with TP from the character being played.
	tpUnlock = true
	#Shenron and Porunga offer "A new life": a Character Capsule, which unlocks one more slot when used.
	wishEnabled = true
	#Seconds between two switches (waived in the login window).
	#Range: 0 ~ 86400
	switchCooldownSeconds = 300
	#No switch for this many seconds after dealing or taking damage.
	#Range: 0 ~ 600
	combatLockSeconds = 15
	#For this many seconds after logging in the switch cooldown does not apply.
	#Range: 0 ~ 3600
	loginWindowSeconds = 120
	#A deleted character can be restored for this many days, then it is gone for good.
	#Range: 1 ~ 365
	deleteRestoreDays = 7
	#Other mods' player data (their capabilities) moves with the character too. Off: it stays with the player.
	otherModData = true
	#Capability ids that never move with a character (a mod whose data keeps live references).
	capabilityDenylist = []
	#No switch while the character holds a unique seat that is still kept per player rather than per character (a Kai seat).
	#Off: the seat follows the player into every character until that seat system keeps its holders per character.
	holderGuard = true
	#While DMZ Character Slots (mod id dmzcharacterslots) is installed, DMZ Ultra's character slots stand aside (true, default): no
	#character screen, no switching, no slot commands, nothing written - only one mod ever swaps a player's data. Characters parked
	#earlier stay on disk untouched. false: both mods may swap characters (not advised). Without that mod this changes nothing.
	standAsideForCharacterSlots = true

