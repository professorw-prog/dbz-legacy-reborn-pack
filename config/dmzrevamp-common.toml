#When true, Combat Flight movement while locked on follows the target in three dimensions. When false, locked Combat Flight keeps Dragon Mine Z's original movement.
combatFlightTridimensional = true
#When true, Lock On can target Android Upgraded players. When false, Dragon Mine Z's original Android targeting restriction is preserved.
allowLockOnAndroid = true
#When true, Form + Stack Form attribute multipliers use Overhaul's BP-balanced interpolation instead of DMZ's additive or multiplicative combination. Other multipliers keep the DMZ gameplay setting.
overhaulUniqueStackMode = false
#When false, Overhaul's requiredDMZLevel form requirement is ignored for unlocking, purchasing, and transforming forms.
enableFormLevelRequirement = true
#Global multiplier applied to all Dragon Mine Z Strike Attack damage after replacing its Strike Damage base with Overhaul Melee Damage.
#Range: 0.0 ~ 1000.0
GlobalStrikeDamageMultiplier = 1.75

[revamp]
	#Controls how Dragon Mine Z's helmetsThatKeepHair list is interpreted. WHITELIST keeps DMZ's default behavior. BLACKLIST makes listed helmets hide hair while all unlisted helmets keep hair.
	#Allowed Values: WHITELIST, BLACKLIST
	helmetKeepHairListMode = "BLACKLIST"

	[revamp.speed]
		#Default extra speed cap percent before sprint or movement ramping increases it.
		#Range: 0.0 ~ 1000000.0
		baseCapPercent = 100.0
		#When false, SPD does not modify movement, swim, flight, step height, or fluid running speed.
		enableMovementSpeedModifiers = true
		#When false, Overhaul does not change player attack speed through Speed or Melee Damage.
		AttackSpeedChange = true
		#When true, Melee Damage reduces the attack speed granted by Speed. When false, only Speed controls attack speed.
		attackSpeedMeleeDecrease = true
		#Lowest attack-speed multiplier Overhaul may produce. 0.5 means no less than 50 percent of normal attack speed.
		#Range: 0.0 ~ 1.0
		maxAttackSpeedDecreasePercentage = 0.5
		#Multiplier applied to SPD movement speed bonus. 1.0 = 100 percent.
		#Range: 0.0 ~ 100.0
		movementBonusMultiplier = 1.0
		#Multiplier applied to SPD swim speed bonus. 0.5 = 50 percent.
		#Range: 0.0 ~ 100.0
		swimBonusMultiplier = 0.5
		#Multiplier applied to SPD combat flight speed bonus. 1.0 = 100 percent.
		#Range: 0.0 ~ 100.0
		combatFlightBonusMultiplier = 1.0
		#Multiplier applied to SPD search flight speed bonus. 0.3 = 30 percent.
		#Range: 0.0 ~ 100.0
		searchFlightBonusMultiplier = 0.3
		#Extra swim speed cap percent before sprint or movement ramping increases it.
		#Range: 0.0 ~ 1000000.0
		swimBaseCapPercent = 100.0
		#Extra combat flight speed cap percent before fast flight movement ramping increases it.
		#Range: 0.0 ~ 1000000.0
		combatFlightBaseCapPercent = 200.0
		#Extra search flight speed cap percent before fast flight movement ramping increases it.
		#Range: 0.0 ~ 1000000.0
		searchFlightBaseCapPercent = 50.0
		#Ticks required to ramp speed caps from the base cap to the full allowed bonus.
		#Range: 1 ~ 1000000
		rampTicks = 100
		#Ticks after stopping movement or sprint before the extra speed cap snaps back to the base cap.
		#Range: 0 ~ 1000000
		resetDelayTicks = 20
		#Soft cap threshold for speed bonus percent. Bonus above this threshold is reduced by the overflow efficiency.
		#Range: 0.0 ~ 1000000.0
		softCapPercent = 900.0
		#Soft cap threshold for running movement speed bonus percent. Bonus above this threshold is reduced by the overflow efficiency.
		#Range: 0.0 ~ 1000000.0
		movementSoftCapPercent = 1500.0
		#Soft cap threshold for swim speed bonus percent. Bonus above this threshold is reduced by the overflow efficiency.
		#Range: 0.0 ~ 1000000.0
		swimSoftCapPercent = 500.0
		#Soft cap threshold for combat flight speed bonus percent. Bonus above this threshold is reduced by the overflow efficiency.
		#Range: 0.0 ~ 1000000.0
		combatFlightSoftCapPercent = 1500.0
		#Soft cap threshold for search flight speed bonus percent. Bonus above this threshold is reduced by the overflow efficiency.
		#Range: 0.0 ~ 1000000.0
		searchFlightSoftCapPercent = 200.0
		#Efficiency applied to speed bonus percent above the soft cap. 0.005 means 0.5 percent efficiency after the soft cap.
		#Range: 0.0 ~ 1.0
		softCapOverflowEfficiency = 2.5E-4
		#Speed value that grants the configured reference movement bonus.
		#Range: 1.0 ~ 1.0E9
		speedReferenceValue = 10000.0
		#Movement bonus at the speed reference. 0.5 means +50%.
		#Range: 0.0 ~ 100.0
		MoveSpeedRefBonusValue = 0.5

[combat]
	#Maximum cooldown reduction from SPD. 0.7 = 70 percent.
	#Range: 0.0 ~ 1.0
	spdCooldownReductionCap = 0.75
	#Maximum Ki attack speed and Strike Rush speed increase from SPD. 0.75 = 75 percent.
	#Range: 0.0 ~ 100.0
	spdAttackSpeedIncreaseCap = 0.75
	#When true, the logarithmic curve is used for Defense damage reduction. When false, player Defense uses Dragon Mine Z's native reduction curve. Speed-based cooldown, cast-time, Ki-attack-speed, and Strike Rush speed effects always use the logarithmic curve.
	customDefenseAndSpeedEffectsCurve = true
	#Stat value where Defense damage reduction and Speed-based cooldown, cast time, Ki attack speed, and Strike Rush speed reach 50% of their configured cap. Form multipliers are excluded. The logarithmic curve always applies to Speed effects; the toggle below controls only Defense.
	#Range: 1.0 ~ 1.0E9
	statRefForDefenseAndCooldowCurves = 500000.0

[dynamicGrowth]
	#When true, Dynamic Growth stat gain messages become less frequent after the configured stat threshold.
	enableNotificationSuppression = true
	#Current stat value where Dynamic Growth messages start using milestone intervals. 1000 means messages show every 10 points from 1000 to 9999, then every 100 points from 10000 to 99999, and so on.
	#Range: 1 ~ 1000000000
	notificationSuppressionStart = 1000
	#When true, Dynamic Growth is blocked after the configured period without player input, except during training minigames.
	antiAfkEnabled = true
	#Seconds without player input before Dynamic Growth is blocked. Training minigames are exempt.
	#Range: 1 ~ 86400
	antiAfkTimeoutSeconds = 60
	#When true, removes Dragon Mine Z's per-award cap of 10 percent of the current stat's required Dynamic Growth XP.
	disableDynamicGrowthCap = true

	[dynamicGrowth.customActions]
		#Fixed Dynamic XP granted per unit by Overhaul custom actions. This is added to the stat-based XP fraction.
		#Range: 0.0 ~ 1000000.0
		fixedXpPerUnit = 0.5
		#Fraction of the relevant stat added as Dynamic XP per unit by Overhaul custom actions. 0.001 means 0.1 percent.
		#Range: 0.0 ~ 100.0
		statFractionPerUnit = 0.005
		#Multiplier for Overhaul custom Dynamic Growth actions that are not unit-based movement, such as block, parry, dodge, counter and gravity training.
		#Range: 0.0 ~ 100.0
		otherActionMultiplier = 0.5

[kiAttacks]
	#Maximum final destruction/explosion multiplier allowed for overcharged Ki attacks. 2.0 = up to two times normal destruction.
	#Range: 1.0 ~ 100.0
	overchargeDestructionMultiplierCap = 2.0
	#When true and dmzkiovercharge is not loaded, Ki attack cooldown from extended overcharge is capped to DMZ's normal 175 percent release limit.
	capOverchargeCooldownToNormalDmzRelease = true
	#When true, limits how many Advanced and Ultimate Ki attacks can be equipped.
	enableCategoryEquipLimits = true
	#Maximum equipped Advanced Ki attacks when category equip limits are enabled.
	#Range: 1 ~ 8
	maxEquippedAdvanced = 2
	#Maximum equipped Ultimate Ki attacks when category equip limits are enabled.
	#Range: 1 ~ 8
	maxEquippedUltimate = 2

[battlePower]
	#When true, Dragon Mine Z saga/manual BP entities with already-set BP have that BP recalculated from their current attributes using the player-style curved BP formula. Normal mobs that use DMZ's mob BP helper always use the custom formula. Entities with exactly Integer.MAX_VALUE BP keep DMZ's hidden BP behavior.
	recalculateDmzEntityBattlePower = true

